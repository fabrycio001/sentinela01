<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Médico</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }


    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }


    .btn-alta {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-alta:hover {
      background: #bd2130;
    }


    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }


    .consultorio-input label {
      font-weight: bold;
    }


    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }


    .botoes-paciente {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- CABEÇALHO -->

  <div
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    "
  >

    <h2 style="margin:0;">
      🩺 Painel Médico
    </h2>


    <button
      class="btn-abrir-tv"
      onclick="abrirTV()"
    >
      📺 Abrir Tela da TV
    </button>

  </div>



  <!-- CONSULTÓRIO -->

  <div class="consultorio-input">

    <label>
      Meu Consultório:
    </label>


    <input
      type="text"
      id="consultorio-num"
      value="01"
    >


    <span
      style="
        color:#666;
        font-size:13px;
      "
    >
      Este número será exibido na TV ao chamar o paciente.
    </span>

  </div>



  <!-- LISTA DE TRIAGENS -->

  <div id="triagens"></div>



  <hr>



  <!-- CONSULTA -->

  <h3>
    Consulta
  </h3>


  <input
    id="paciente"
    placeholder="Paciente"
    readonly
  >


  <input
    id="diagnostico"
    placeholder="Diagnóstico"
  >


  <select id="medicacao">

    <option value="">
      Selecione a medicação
    </option>

  </select>


  <textarea
    id="obs"
    placeholder="Observações"
  ></textarea>


  <button
    class="btn-block"
    onclick="salvar()"
  >
    Salvar
  </button>


</div>



<script>


/* =====================================================
   VARIÁVEL GLOBAL
   ===================================================== */

let triagensCarregadas = [];



/* =====================================================
   ABRIR TV
   ===================================================== */

function abrirTV() {

  window.open(
    "tv.html",
    "_blank"
  );

}



/* =====================================================
   CARREGAR TRIAGENS
   ===================================================== */

function carregar() {

  fetch("/triagens")

    .then(response => {

      if (!response.ok) {
        throw new Error(
          "Erro HTTP: " + response.status
        );
      }

      return response.json();

    })

    .then(data => {

      triagensCarregadas = data;

      const div =
        document.getElementById("triagens");

      div.innerHTML = "";


      /* Nenhum paciente */

      if (
        !data ||
        data.length === 0
      ) {

        div.innerHTML = `
          <p
            style="
              color:#888;
              text-align:center;
              padding:20px;
            "
          >
            Nenhum paciente na fila.
          </p>
        `;

        return;

      }



      /* =================================================
         CRIAR CARDS
         ================================================= */

      data.forEach((t, index) => {


        /*
          NÃO colocamos o nome diretamente dentro
          de onclick.

          Usamos o INDEX do paciente.

          Isso evita problemas com:

          João D'Ávila
          Maria "Silva"
          José
          nomes com acentos etc.
        */


        div.innerHTML += `

          <div class="card">


            <h3>
              ${t.nome || "Paciente"}
            </h3>


            <p>
              <b>Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>


            <p>
              <b>Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>


            <p>
              <span class="${t.risco || ""}">
                ${t.risco || "Não informado"}
              </span>
            </p>


            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>


            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>



            <div class="botoes-paciente">


              <!-- ATENDER -->

              <button
                onclick="selecionar(${index})"
              >
                Atender
              </button>



              <!-- CHAMAR NA TV -->

              <button
                class="btn-tv"
                onclick="chamarPacientePorIndice(${index})"
              >
                📺 Chamar na TV
              </button>



              <!-- DAR ALTA -->

              <button
                class="btn-alta"
                onclick="abrirAltaPorIndice(${index})"
              >
                🟢 Dar Alta
              </button>


            </div>


          </div>

        `;

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar triagens:",
        error
      );

      document.getElementById("triagens").innerHTML = `

        <p
          style="
            color:red;
            text-align:center;
          "
        >
          ❌ Erro ao carregar pacientes.
        </p>

      `;

    });

}



/* =====================================================
   DAR ALTA
   ===================================================== */

function abrirAltaPorIndice(index) {


  const paciente =
    triagensCarregadas[index];


  if (!paciente) {

    alert(
      "Paciente não encontrado."
    );

    return;

  }


  const nome =
    paciente.nome || "Paciente";


  /*
    encodeURIComponent garante que nomes como:

    João da Silva
    José D'Ávila
    Maria & João

    sejam enviados corretamente.
  */

  const url =
    "alta.html?paciente=" +
    encodeURIComponent(nome);


  console.log(
    "Abrindo formulário de alta:",
    url
  );


  /*
    Redireciona a página atual
  */

  window.location.href = url;

}



/* =====================================================
   CHAMAR NA TV
   ===================================================== */

function chamarPacientePorIndice(index) {


  const paciente =
    triagensCarregadas[index];


  if (!paciente) {

    alert(
      "Paciente não encontrado."
    );

    return;

  }


  chamarNaTV(
    paciente.nome
  );

}



function chamarNaTV(nome) {


  const consultorio =
    document
      .getElementById("consultorio-num")
      .value
      .trim() || "01";


  fetch("/tv/chamar", {

    method: "POST",

    headers: {

      "Content-Type":
        "application/json"

    },

    body: JSON.stringify({

      localTipo:
        "CONSULTÓRIO",

      localNumero:
        consultorio,

      paciente:
        nome

    })

  })

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "Erro HTTP: " +
        response.status
      );

    }

    return response.json();

  })

  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  })

  .catch(error => {

    console.error(
      "Erro ao chamar na TV:",
      error
    );

    alert(
      "❌ Não foi possível chamar o paciente na TV."
    );

  });

}



/* =====================================================
   SELECIONAR PACIENTE
   ===================================================== */

function selecionar(index) {


  const t =
    triagensCarregadas[index];


  if (!t) {

    alert(
      "Paciente não encontrado."
    );

    return;

  }


  document.getElementById(
    "paciente"
  ).value =
    t.nome || "";


  document.getElementById(
    "obs"
  ).value =
    t.observacao || "";


  if (
    t.alergia &&
    t.alergia !== "Nenhuma"
  ) {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

}



/* =====================================================
   CARREGAR MEDICAÇÕES
   ===================================================== */

function carregarMedicacoes() {


  fetch("/lista-medicacoes")

    .then(response => {

      if (!response.ok) {

        throw new Error(
          "Erro HTTP: " +
          response.status
        );

      }

      return response.json();

    })

    .then(data => {


      const select =
        document.getElementById(
          "medicacao"
        );


      select.innerHTML = `

        <option value="">
          Selecione a medicação
        </option>

      `;


      data.forEach(med => {


        const option =
          document.createElement(
            "option"
          );


        option.value =
          med;


        option.textContent =
          med;


        select.appendChild(
          option
        );

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar medicações:",
        error
      );

    });

}



/* =====================================================
   SALVAR CONSULTA
   ===================================================== */

function salvar() {


  const paciente =
    document.getElementById(
      "paciente"
    ).value;


  const diagnostico =
    document.getElementById(
      "diagnostico"
    ).value;


  const medicacao =
    document.getElementById(
      "medicacao"
    ).value;


  const obs =
    document.getElementById(
      "obs"
    ).value;



  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;

  }



  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;

  }



  fetch("/consulta", {

    method: "POST",

    headers: {

      "Content-Type":
        "application/json"

    },

    body: JSON.stringify({

      paciente:
        paciente,

      diagnostico:
        diagnostico,

      medicacao:
        medicacao,

      obs:
        obs

    })

  })

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "Erro HTTP: " +
        response.status
      );

    }

    return response.json();

  })

  .then(() => {


    alert(
      "✅ Consulta salva!"
    );


    document.getElementById(
      "diagnostico"
    ).value = "";


    document.getElementById(
      "medicacao"
    ).value = "";


    document.getElementById(
      "obs"
    ).value = "";


    carregar();

  })

  .catch(error => {

    console.error(
      "Erro ao salvar consulta:",
      error
    );


    alert(
      "❌ Erro ao salvar consulta."
    );

  });

}



/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

carregar();

carregarMedicacoes();



/*
  Atualiza a fila automaticamente
  a cada 10 segundos.
*/

setInterval(
  carregar,
  10000
);


</script>


</body>

</html>
```
